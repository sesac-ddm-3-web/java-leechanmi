<!-- login.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 - Simple Board</title>
  <link rel="stylesheet" href="styles.css">
  <script src="common.js"></script>
</head>
<body>
  <div class="form-card">
    <div class="form-title">로그인</div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">아이디</label>
        <input id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input id="password" type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">로그인</button>
      <div id="error" class="error-message"></div>
    </form>
    <div class="mt-16 text-center">
      아직 회원이 아니신가요?
      <a href="signup.html">회원가입 하기</a>
    </div>
  </div>

  <script>
    // 이미 로그인 되어 있으면 목록으로
    if (getToken()) {
      window.location.href = 'posts.html';
    }

    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';

      const username = form.username.value.trim();
      const password = form.password.value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          errorEl.textContent = '로그인에 실패했습니다. 아이디/비밀번호를 확인해주세요.';
          return;
        }

        const data = await res.json();
        setToken(data.accessToken);
        window.location.href = 'posts.html';
      } catch (err) {
        console.error(err);
        errorEl.textContent = '서버와 통신 중 오류가 발생했습니다.';
      }
    });
  </script>
</body>
</html>
