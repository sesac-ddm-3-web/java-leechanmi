<!-- new-post.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>새 글 쓰기 - Simple Board</title>
  <link rel="stylesheet" href="styles.css">
  <script src="common.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-title">새 글 쓰기</div>
      <div class="header-nav">
        <a href="posts.html">목록으로</a>
        <button type="button" onclick="logout()">로그아웃</button>
      </div>
    </header>

    <form id="postForm">
      <div class="form-group">
        <label for="title">제목</label>
        <input id="title" name="title" required>
      </div>
      <div class="form-group">
        <label for="content">내용</label>
        <textarea id="content" name="content" required></textarea>
      </div>
      <div class="text-right mt-16">
        <button type="button" class="btn btn-outline" onclick="window.location.href='posts.html'">취소</button>
        <button type="submit" class="btn btn-primary">등록</button>
      </div>
      <div id="error" class="error-message"></div>
    </form>
  </div>

  <script>
    requireAuth();

    const form = document.getElementById('postForm');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';

      const title = form.title.value.trim();
      const content = form.content.value.trim();

      if (!title || !content) {
        errorEl.textContent = '제목과 내용을 입력해주세요.';
        return;
      }

      try {
        const res = await apiFetch('/api/posts', {
          method: 'POST',
          body: JSON.stringify({ title, content })
        });

        if (!res.ok) {
          errorEl.textContent = '게시글 등록에 실패했습니다.';
          return;
        }

        const data = await res.json();
        const postId = data.postId;
        window.location.href = `post-detail.html?id=${postId}`;
      } catch (err) {
        console.error(err);
        errorEl.textContent = '서버와 통신 중 오류가 발생했습니다.';
      }
    });
  </script>
</body>
</html>
