spring:
  datasource:
    url: jdbc:mysql://localhost:3306/simple_board?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        show_sql: false
        format_sql: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

jwt:
  secret: LOCAL_ONLY_JWT_SECRET_DO_NOT_USE_IN_PROD_XXXXXXXXXXXXXXXX